rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-high-level-description:
    status: done
    comment: Covered by README.md; moves to home-assistant.io with the core port.
  docs-installation-instructions:
    status: done
    comment: Covered by README.md; moves to home-assistant.io with the core port.
  docs-removal-instructions:
    status: done
    comment: Covered by README.md; moves to home-assistant.io with the core port.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; the coordinator drives updates.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options.
  docs-installation-parameters:
    status: exempt
    comment: No installation parameters.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Public API without authentication.
  test-coverage: done
