name: Release ZIP on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip component files
        run: |
          cd custom_components/amb_bellinzona
          zip -r ../../amb_bellinzona.zip .

      - name: Append README and HACS.json to zip
        run: |
          zip -ur amb_bellinzona.zip README.md hacs.json

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: amb_bellinzona.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}